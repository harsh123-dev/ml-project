# Configuration for AIRWISE Air Quality Prediction System

project:
  name: "AIRWISE"
  title: "Explainable Air Quality Index Prediction Using Ensemble Machine Learning and Weather Data"
  version: "1.0.0"
  random_seed: 42

dataset:
  name: "Beijing Multi-Site Air Quality Dataset"
  source_url: "https://archive.ics.uci.edu/dataset/501/beijing+multi+site+air+quality+data"
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  primary_station: "Aotizhongxin"
  all_stations:
    - "Aotizhongxin"
    - "Changping"
    - "Dingling"
    - "Dongsi"
    - "Guanyuan"
    - "Gucheng"
    - "Huairou"
    - "Nongzhanguan"
    - "Shunyi"
    - "Tiantan"
    - "Wanliu"
    - "Wanshouxigong"

columns:
  temporal:
    - "year"
    - "month"
    - "day"
    - "hour"
  pollution:
    - "PM2.5"
    - "PM10"
    - "SO2"
    - "NO2"
    - "CO"
    - "O3"
  weather:
    - "TEMP"
    - "PRES"
    - "DEWP"
    - "RAIN"
    - "WSPM"
  categorical:
    - "wd"

aqi:
  standard: "US_EPA" # Options: "US_EPA", "CPCB"
  target_col: "AQI_target"
  horizon_hours: 1

split:
  train_ratio: 0.80
  val_ratio: 0.10
  test_ratio: 0.10
  shuffle: false

models:
  linear_regression:
    fit_intercept: true
  random_forest:
    n_estimators: 100
    max_depth: 16
    min_samples_split: 5
    min_samples_leaf: 2
    random_state: 42
    n_jobs: -1
  xgboost:
    n_estimators: 120
    learning_rate: 0.08
    max_depth: 6
    subsample: 0.85
    colsample_bytree: 0.85
    random_state: 42
    n_jobs: -1
  lightgbm:
    n_estimators: 120
    learning_rate: 0.08
    num_leaves: 31
    max_depth: 6
    subsample: 0.85
    random_state: 42
    verbose: -1
  catboost:
    iterations: 120
    learning_rate: 0.08
    depth: 6
    random_seed: 42
    verbose: 0

paths:
  models_dir: "models"
  outputs_dir: "outputs"
  metrics_dir: "outputs/metrics"
  charts_dir: "outputs/charts"
  shap_dir: "outputs/shap"
  predictions_dir: "outputs/predictions"
